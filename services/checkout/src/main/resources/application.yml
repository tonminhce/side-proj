# services/checkout/src/main/resources/application.yml — Story 2.3
# Per-service datasource. Defaults match dev/postgres-init entries; prod secrets come
# from Vault (ADR-21). No real secrets in this file.

server:
  port: 8084   # CheckoutService: 8084. catalog 8081, admin-bff 8082, inventory 8083, checkout 8084, cart 8085.

spring:
  application:
    name: checkout

  main:
    # util's library beans intentionally override Spring Boot autoconfig beans; allow it.
    allow-bean-definition-overriding: true

  autoconfigure:
    # Same Modulith bridge exclusion as cart (Story 2.1 pattern): our ModulithOutboxPublisher
    # writes the canonical `outbox` table directly, so the bridge's JDBC EventPublicationRepository
    # (which expects its own EVENT_PUBLICATION column shape) is excluded. The in-process
    # @ApplicationModuleListener leg (spring-modulith-events-core) stays intact.
    exclude:
      - org.springframework.modulith.events.jdbc.JdbcEventPublicationAutoConfiguration
      - vn.vnpt.util.UtilsAutoConfiguration

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_CHECKOUT_DB:checkout_db}
    username: ${POSTGRES_CHECKOUT_USER:checkout_user}
    password: ${POSTGRES_CHECKOUT_PASSWORD:checkout_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns schema; JPA validates entity <-> table mapping.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Story 2.5 — checkout depends on inventory module; let Hibernate's archive scanner
        # auto-discover @Entity types in both modules' jars.
        archive:
          scanner:
            detect:
              - class
              - package
    # architecture.md anti-pattern guard: never auto-open a transaction in the view layer.
    open-in-view: false

  flyway:
    enabled: true
    # checkout migrations live under db/migration/checkout/ (sub-folder) to avoid classpath
    # collisions with sibling service migrations when a downstream service depends on both.
    locations: classpath:db/migration/checkout
    baseline-on-migrate: true
    table: flyway_schema_history

  # Spring Modulith outbox bridge — ADR-01 / ADR-14 / ADR-20.
  modulith:
    events:
      jdbc:
        poll-interval: 500ms   # architecture-detail.md line 146 (ADR-14 operational)
      outbox:
        publish-backpressure-threshold: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

checkout:
  events:
    # ADR-20 producer HMAC secret for checkout.started events. Prod overrides via Vault at
    # secret/events/hmac/checkout. Computed over the JCS-canonical payload in CheckoutEventPublisher.
    hmac-secret: ${CHECKOUT_EVENTS_HMAC_SECRET:dev-only-secret-do-not-use-in-prod}
  stripe:
    # Story 2.4 / FR-20 — Stripe API key. Dev uses test-mode key (sk_test_...) only.
    # Prod overrides via Vault at secret/stripe/<profile> per ADR-18 — no real key in this file.
    api-key: ${STRIPE_API_KEY:sk_test_dev-placeholder-do-not-use-in-prod}
    # Default currency for PaymentIntent creation when request omits it. VND has no fractional
    # unit — Stripe amount is the đồng value.
    currency-default: ${CHECKOUT_STRIPE_CURRENCY_DEFAULT:VND}

logging:
  level:
    vn.vnpt.checkout: INFO
    org.springframework.modulith: INFO

tenants:
  datasources:
    default:
      url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${CHECKOUT_DB:checkout_db}
      username: ${CHECKOUT_USER:checkout_user}
      password: ${CHECKOUT_PASSWORD:checkout_pass}
      driver-class-name: org.postgresql.Driver

# Saga 2.5 — adapter needs HMAC secret from inventory module (dev default)
inventory.events.hmac-secret: dev-only-secret-do-not-use-in-prod

# Saga 2.5 — catalog HMAC secret (dev default)
catalog.events.hmac-secret: dev-only-secret-do-not-use-in-prod
