# services/payment/src/test/resources/application-test.yml — Story 3.2
# Test profile. Datasource is overridden at runtime by @DynamicPropertySource (Testcontainers).
# Mirrors the catalog / checkout test yml shape.

server:
  port: 0   # Random port for @SpringBootTest.

spring:
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: ${TC_POSTGRES_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${TC_POSTGRES_USER:payment_user}
    password: ${TC_POSTGRES_PASSWORD:payment_pass}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration/payment
    baseline-on-migrate: true

  # Same Modulith bridge exclusion as main; util's UtilsAutoConfiguration bug is excluded here too
  # so tests don't trip on FileProperties / FolderProperties / TelegramProperties dual-bean registration.
  autoconfigure:
    exclude:
      - vn.vnpt.util.UtilsAutoConfiguration
      - org.springframework.modulith.events.jdbc.JdbcEventPublicationAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    vn.vnpt.payment: INFO

stripe:
  # Mirrors StripeProperties (mode / apiKey / apiVersion / webhookSigningSecret). The @SpringBootTest
  # context (e.g. StripeWebhookEndToEndIT) binds this so StripeProperties.mode() etc. are non-null.
  # Without these keys, the @ConfigurationProperties binding would log a validation warning and the
  # RealStripePaymentAdapter's @PostConstruct init() would fail on the apiKey null check.
  mode: test
  api-key: sk_test_dev_placeholder
  api-version: "2025-09-30.clover"
  webhook-signing-secret: whsec_test_payment
