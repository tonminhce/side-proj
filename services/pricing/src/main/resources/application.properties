# Pricing service — explicit autoconfigure exclusions (Spring Boot 4). Pricing has no DB + no
# Modulith outbox; the exclusions in yml are ignored because util's classpath brings in
# spring-data-jpa transitively. application.properties takes precedence and is processed first.
#
# Spring Boot 4 repackaged autoconfig classes under
#   org.springframework.boot.{module}.autoconfigure.*  (was: autoconfigure.{module}.*)
# The old names silently no-op'd — root cause of Story 5.7 smoke bootstrap failure.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.health.DataSourceHealthContributorAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.JpaRepositoriesAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.RedisAutoConfiguration,\
  org.springframework.modulith.events.config.EventPublicationAutoConfiguration,\
  org.springframework.modulith.events.config.EventExternalizationAutoConfiguration,\
  vn.vnpt.util.UtilsAutoConfiguration,\
  vn.vnpt.util.events.EventsAutoConfiguration
spring.data.jpa.repositories.enabled=false