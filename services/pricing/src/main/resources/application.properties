# Pricing service — explicit autoconfigure exclusions (Spring Boot 4). Pricing has no DB + no
# Modulith outbox; the exclusions in yml are ignored because util's classpath brings in
# spring-data-jpa transitively. application.properties takes precedence and is processed first.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  vn.vnpt.util.events.EventsAutoConfiguration
spring.data.jpa.repositories.enabled=false