server:
  port: 8090   # PricingService: 8090. catalog 8081, admin-bff 8082, inventory 8083, checkout 8084, cart 8085, payment 8086, order 8087, customer 8088, auth 8089, gateway 8080.

spring:
  application:
    name: pricing

  main:
    allow-bean-definition-overriding: true

  autoconfigure:
    exclude:
      - vn.vnpt.util.UtilsAutoConfiguration
      - vn.vnpt.util.events.EventsAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

  # Pricing has no DB; the YAML exclusion of DataSource + JPA + Flyway prevents the autoconfig
  # from trying to build a DataSource. The static pricebook is loaded from pricebook.json.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# FR-67 multi-currency: v1 is VND-only. Static FX rate (1.0 = no conversion).
pricing:
  fx-rate: 1.0
  default-currency: VND