server:
  port: 8088   # CustomerService: 8088. catalog 8081, admin-bff 8082, inventory 8083, checkout 8084, cart 8085, payment 8086, order 8087, gateway 8080.

spring:
  application:
    name: customer

  main:
    allow-bean-definition-overriding: true

  autoconfigure:
    exclude:
      - vn.vnpt.util.UtilsAutoConfiguration

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_CUSTOMER_DB:customer_db}
    username: ${POSTGRES_CUSTOMER_USER:customer_user}
    password: ${POSTGRES_CUSTOMER_PASSWORD:customer_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration/customer
    baseline-on-migrate: true
    table: flyway_schema_history

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    vn.vnpt.customer: INFO

folder:
  folderTemp: /tmp/customer/tmp
file:
  end-point: http://localhost:9000
  access-key: minio
  secret-key: minio123
  bucket-name: customer-files
telegram:
  error-bot-token: dev-placeholder
  error-group-chat-id: "0"
  is-send-error: false

tenants:
  datasources:
    default:
      jdbcUrl: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_CUSTOMER_DB:customer_db}
      driverClassName: org.postgresql.Driver
      username: ${POSTGRES_CUSTOMER_USER:customer_user}
      password: ${POSTGRES_CUSTOMER_PASSWORD:customer_pass}