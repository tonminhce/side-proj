# util/src/main/resources/application.yml — defaults inherited by every service that depends on util.
# Provides values for util's @ConfigurationProperties beans (FolderProperties, FileProperties,
# TelegramProperties) so the spring container can resolve all placeholders without requiring every
# service to duplicate these. Override per-service in your own application.yml.

folder:
  temp:
    timeToLive: 30

file:
  endPoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minio}
  secretKey: ${MINIO_SECRET_KEY:minio123}
  bucketName: ${MINIO_BUCKET:dvc-bucket}
  publicBucketName: ${MINIO_PUBLIC_BUCKET:public-bucket}
  dvcBucketName: ${MINIO_DVC_BUCKET:dvc-bucket}
  subDirectory: tmp

telegram:
  errorBotToken: ${TELEGRAM_BOT_TOKEN:dev-empty}
  errorGroupChatId: ${TELEGRAM_GROUP_CHAT_ID:0}
  isSendError: false